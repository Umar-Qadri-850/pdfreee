# Pdfreee static server.
#
# The build emits a real <route>/index.html for every route (static meta
# prerendering), so deep links resolve without a server rewrite in most cases.
# The try_files fallback below is a safety net for any path we did not prerender.
#
# CACHING MODEL (why each policy exists):
#   * HTML entry points (index.html, <route>/index.html, 404) -> no-cache,
#     must-revalidate. These are NOT content-hashed: a deploy changes their
#     bytes at the same URL, so browsers must revalidate to discover the latest
#     build. Immutable caching here would pin users to an old bundle.
#   * Hashed JS/CSS/images/fonts under /assets/ -> immutable, max-age 1y. Their
#     filenames are content-hashed by Vite, so a URL change guarantees a content
#     change; old hashes are simply never referenced again.
#   * The PDF.js worker (assets/pdf.worker.min-<hash>.mjs) -> no-cache,
#     must-revalidate, while keeping Content-Type: application/javascript. Its
#     URL is content-hashed and can stay identical across deploys even when its
#     response headers change (the MIME bug was fixed without changing the URL),
#     so immutable caching would retain stale response metadata for up to a year.
#     Revalidation (ETag/304) refreshes headers while the body stays in cache.
#     This does NOT remotely clear an already-cached immutable response; those
#     browsers need a one-time hard reload (documented in PRODUCTION_AUDIT.md).
#
# NOTE ON ADS: the Content-Security-Policy below allows only same-origin scripts.
# If you later enable Google AdSense or any third-party ad/analytics script, you
# MUST add its origins to script-src/connect-src/frame-src or it will be blocked.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    # --- Health check -----------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- PDF.js .mjs worker: revalidate, never immutable ------------------
    # Takes precedence over location /assets/ for .mjs files. Security headers
    # are repeated because this location declares its own add_header (which
    # suppresses inheritance of the server-level set above).
    location ~* \.mjs$ {
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Immutable hashed assets -----------------------------------------
    # Only content-hashed files (js/css/images/fonts/wasm) arrive here; .mjs is
    # diverted to the regex location above so it revalidates instead. Shared
    # with that location: nginx maps "js" but not "mjs", so mime.types is
    # re-included (a bare `types {}` block would REPLACE every inherited map).
    location /assets/ {
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    # --- HTML and metadata: always revalidate -----------------------------
    # Covers index.html, every prerendered <route>/index.html, 404.html and
    # sitemap/robots. Security headers are repeated here because this location
    # sets its own add_header, which suppresses inheritance of the server-level
    # ones above.
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # --- SPA / prerendered routes fallback --------------------------------
    # Serves naked route paths (/) and any non-hashed file that reached this
    # location (e.g. favicon.svg) or the /index.html safety net. Nothing here is
    # content-hashed, so browsers must revalidate - NOT immutable. Security
    # headers are repeated because this location declares its own add_header.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri/index.html $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}